<!DOCTYPE html>
<html lang="es">
<head>
<script>
  /* Si el archivo se abre directamente (doble clic o vista previa),
     se redirige al servidor de desarrollo para que la pagina se
     muestre correctamente en lugar de salir en blanco. */
  if (location.protocol === "file:") {
    var nombre = decodeURIComponent(location.pathname.split("/").pop());
    location.replace("http://localhost:5173/" + nombre);
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Administracion - Montes Abogados Asociados</title>

  <!--
  PANEL DE ADMINISTRACION
  =========================
  Este es el lugar donde se cambian los datos del sitio.

  Como usarlo:
   1. Escriba la contrasena y pulse Entrar.
   2. Cambie lo que necesite: los datos de la empresa, los
      telefonos y correos, las direcciones, las areas de
      servicio, el equipo, el logotipo y el color.
   3. Pulse "Guardar cambios" y listo: la pagina ya sale
      con los datos nuevos.

  Los cambios quedan guardados en este computador, que es
  como se guardan las preferencias de cualquier navegador.
  Para que los vea todo el mundo habria que subir la pagina
  de nuevo al sitio web, y eso lo hace la persona que
  administra el hosting.
-->
</head>
<body>
  <div id="root" data-pagina="panel-administracion.html"></div>
  <script type="module" src="/admin-main.jsx"></script>
</body>
</html>
