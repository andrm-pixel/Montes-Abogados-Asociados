<script>
  /* Si el archivo se abre directamente (doble clic o vista previa),
     se redirige al servidor de desarrollo para que la pagina se
     muestre correctamente en lugar de salir en blanco. */
  if (location.protocol === "file:") {
    var nombre = decodeURIComponent(location.pathname.split("/").pop());
    location.replace("http://localhost:5173/" + nombre);
  }
</script>
